routes:
    "https://{all}/": { type: upstream, upstream: "varnish:http", cache: { enabled: false } }
    "http://{all}/": { type: redirect, to: "https://{all}/" }

services:
    database:
        type: postgresql:16
    varnish:
        type: varnish:9.0
        relationships:
            application: 'app:http'
        configuration:
            vcl: !include
                type: string
                path: config.vcl
    files:
        type: network-storage:2.0

    rediscache:
        type: redis:8.0

    queue:
        type: rabbitmq:4.2
        size: S

applications:
    app:
        source:
            root: "/"

        type: php:8.5

        runtime:
            extensions:
                - amqp
                - apcu
                - blackfire
                - ctype
                - iconv
                - mbstring
                - pdo_pgsql
                - redis
                - sodium
                - xsl

        variables:
            php:
                opcache.preload: config/preload.php

        build:
            flavor: none

        web:
            locations:
                "/":
                    root: "public"
                    expires: 1h
                    passthru: "/index.php"

        mounts:
            "/var/cache": { source: instance, source_path: var/cache }
            "/var/share": { source: storage, source_path: var/share }
            "/public/uploads": { source: service, service: files, source_path: uploads }
            

        relationships:
            database: "database:postgresql"
            redis: "rediscache:redis"
            rabbitmq: "queue:rabbitmq"

        hooks:
            build: |
                set -x -e

                curl -fs https://get.symfony.com/cloud/configurator | bash
                
                NODE_VERSION=22 symfony-build

            deploy: |
                set -x -e

                symfony-deploy

        crons:
            security-check:
                # Check that no security issues have been found for PHP packages deployed in production
                spec: '50 23 * * *'
                commands:
                    start: if [ "$PLATFORM_ENVIRONMENT_TYPE" = "production" ]; then croncape COMPOSER_ROOT_VERSION=1.0.0 COMPOSER_AUDIT_ABANDONED=ignore composer audit --no-cache; fi
            clean-expired-sessions:
                spec: '17,47 * * * *'
                commands:
                    start: croncape php-session-clean

        workers:
            messenger:
                commands:
                    # Consume "async" messages (as configured in the routing section of config/packages/messenger.yaml)
                    start: symfony console --time-limit=3600 --memory-limit=64M messenger:consume async scheduler_default
